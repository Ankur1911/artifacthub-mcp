[project]
name = "artifacthub-mcp"
version = "0.1.0"
description = "MCP server for Artifact Hub: search and inspect Helm charts, operators, plugins and other Kubernetes packages, with security reports, changelogs and chart values."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankur Kapuriya" }]
requires-python = ">=3.12"
keywords = ["mcp", "artifact-hub", "helm", "kubernetes", "cloud-native"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
]

[project.scripts]
artifacthub-mcp = "artifacthub_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
